name: Saturday review narration existing GitHub keys
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One free narration attempt with existing saved shorts voice
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/saturday_review_voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saturday-review-voice-${{ github.run_id }}
          path: out/saturday-review-voice/
          if-no-files-found: warn
          retention-days: 7
