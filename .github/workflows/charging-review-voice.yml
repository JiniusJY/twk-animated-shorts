name: Huang review narration free-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate review narration with existing free-model keys
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/huang_review_voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huang-review-voice-${{ github.run_id }}
          path: out/huang-review-voice/
          retention-days: 7
