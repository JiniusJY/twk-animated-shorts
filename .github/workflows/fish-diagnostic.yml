name: Fish free one-request diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One short free-model request, no fallback
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
        run: python scripts/diagnose_fish_free.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-free-diagnostic-${{ github.run_id }}
          path: out/fish-diagnostic/
          retention-days: 7
