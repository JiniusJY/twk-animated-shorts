name: Release review regression tests
on:
  pull_request:
    paths:
      - 'scripts/check_caption_cues.py'
      - 'scripts/check_release_review.py'
      - 'scripts/release_gate.py'
      - 'tests/test_fixed_captions.py'
      - 'tests/test_release_review.py'
      - '.github/workflows/release-review-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_release_review.py -v
      - run: python -m unittest discover -s tests -p test_fixed_captions.py -v
