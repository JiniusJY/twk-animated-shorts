name: Render Animated Short

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode slug inside src/episodes/ (e.g. boeing-248-days)"
        required: true
        default: "boeing-248-days"
      scale:
        description: "Output scale (1 = 1080x1920 HD, 1.3333333333333333 = 1440x2560 2K)"
        required: false
        default: "1"
      shards:
        description: "Parallel render shards (up to 16 on free public runners)"
        required: false
        default: "15"
      storyboard:
        description: "Render a 4-still storyboard preview before the paid render"
        required: false
        default: "true"

concurrency:
  group: render-${{ github.event.inputs.episode || 'default' }}
  cancel-in-progress: true

# Least privilege: read-only by default; only the publish job gets contents:write.
# NOTE: actions are pinned by major tag, not SHA, because SHA pins cannot be
# verified offline; enable Dependabot for github-actions to keep them fresh.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow inputs (before anything spends money)
        run: |
          set -euo pipefail
          EP="${{ inputs.episode }}"
          if ! [[ "$EP" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "invalid episode slug: $EP" >&2; exit 1
          fi
          test -f "src/episodes/$EP/episode.json" || { echo "no such episode: $EP" >&2; exit 1; }
          S="${{ inputs.shards }}"
          if ! [[ "$S" =~ ^[0-9]+$ ]] || [ "$S" -lt 1 ] || [ "$S" -gt 16 ]; then
            echo "shards must be 1-16, got: $S" >&2; exit 1
          fi
          SC="${{ inputs.scale }}"
          if ! [[ "$SC" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "scale must be numeric, got: $SC" >&2; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Typecheck, unit tests, schema + lint gates
        run: |
          npx tsc --noEmit
          npx vitest run
          npx tsx scripts/validate_episode.ts "src/episodes/${{ inputs.episode }}/episode.json"
          npx tsx scripts/lint_episode.ts "src/episodes/${{ inputs.episode }}/episode.json"

  storyboard:
    needs: validate
    if: ${{ inputs.storyboard == 'true' }}
    continue-on-error: true  # advisory preview; never blocks the render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install system Chromium libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libgl1 libegl1 mesa-vulkan-drivers
      - run: npm ci
      - name: Cache Remotion headless browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Render 4 storyboard stills across the runtime
        run: |
          mkdir -p out/stills
          DUR=$(python3 -c "import json; print(json.load(open('src/episodes/${{ inputs.episode }}/episode.json'))['durationFrames'])")
          for PCT in 5 35 65 95; do
            F=$(( DUR * PCT / 100 ))
            npx remotion still src/index.ts "${{ inputs.episode }}" "out/stills/still-$PCT.png" --frame=$F
          done
      - name: Upload storyboard stills
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-${{ inputs.episode }}-${{ github.run_id }}
          path: out/stills/
          retention-days: 7

  prepare:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      duration: ${{ steps.meta.outputs.duration }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-audio-v2-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}
      - name: Install audio dependencies (pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements-ci.txt
      - name: Generate cloud voiceover & word timings (paid - runs only after validation passed)
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/voice.py --episode "src/episodes/${{ inputs.episode }}"
      - name: Build procedural audio mix (-15 LUFS) & sync timings
        run: |
          mkdir -p out
          python3 scripts/audio_bed.py --episode "src/episodes/${{ inputs.episode }}" --props-out out/props.json
      - id: shards
        name: Compute parallel render shards
        run: |
          MATRIX=$(python3 scripts/make_shards.py out/props.json "${{ inputs.shards }}")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - id: meta
        name: Record expected duration
        run: echo "duration=$(python3 -c "import json; print(json.load(open('out/props.json'))['durationFrames'] / json.load(open('out/props.json'))['fps'])")" >> "$GITHUB_OUTPUT"
      - name: Upload prepared audio & props
        uses: actions/upload-artifact@v4
        with:
          name: prep-${{ inputs.episode }}-${{ github.run_id }}
          path: |
            out/props.json
            src/episodes/${{ inputs.episode }}/audio/mix.wav
          retention-days: 1

  render:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install system Chromium libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libgl1 libegl1 mesa-vulkan-drivers
      - run: npm ci
      - name: Cache Remotion headless browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Download prepared props
        uses: actions/download-artifact@v4
        with:
          name: prep-${{ inputs.episode }}-${{ github.run_id }}
          path: prep
      - name: Render shard ${{ matrix.shard.idx }} (${{ matrix.shard.range }})
        run: |
          mkdir -p out
          PROPS=$(find prep -name 'props.json' | head -n 1)
          npx remotion render src/index.ts "${{ inputs.episode }}" "out/chunk-${{ matrix.shard.idx }}.mp4" \
            --codec h264 --crf 16 --scale "${{ inputs.scale }}" \
            --props="$PROPS" \
            --frames="${{ matrix.shard.range }}" \
            --timeout=120000 \
            --muted --gl=swangle
      - name: Upload rendered chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ inputs.episode }}-${{ github.run_id }}-${{ matrix.shard.idx }}
          path: out/chunk-${{ matrix.shard.idx }}.mp4
          retention-days: 1

  publish:
    needs: [prepare, render]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download prepared audio & rendered chunks
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ inputs.episode }}-${{ github.run_id }}*"
          path: chunks
          merge-multiple: true
      - name: Concatenate chunks & mux mastered audio
        run: |
          mkdir -p out
          find chunks -name 'chunk-*.mp4' | sort | sed "s|^|file '|;s|$|'|" > concat.txt
          cat concat.txt
          MIX=$(find chunks -name 'mix.wav' | head -n 1)
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy out/video.mp4
          ffmpeg -y -i out/video.mp4 -i "$MIX" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest out/final.mp4
      - name: QA gate (publish-blocking)
        run: |
          python3 scripts/qa_gate.py --video out/final.mp4 \
            --expected-seconds "${{ needs.prepare.outputs.duration }}" \
            --metrics-out out/qa_metrics.json
      - name: Upload final MP4 + QA metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.episode }}
          path: |
            out/final.mp4
            out/qa_metrics.json
          retention-days: 30
      - name: Publish MP4 to GitHub Release (only if QA passed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ep-${{ inputs.episode }}-${{ github.run_number }}"
          gh release create "$TAG" out/final.mp4 out/qa_metrics.json \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.episode }} (#${{ github.run_number }})" \
            --notes "Automated parallel cloud render for episode ${{ inputs.episode }}. QA gate passed (see qa_metrics.json)."
