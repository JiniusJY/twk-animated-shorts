name: Render Animated Short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition ID to render"
        required: true
        default: "BridgeShort"
      scale:
        description: "Output scale (1 = 1080x1920, 1.3333 = 1440x2560)"
        required: false
        default: "1.3333"
      audio_file:
        description: "Optional path to mixed audio WAV/MP3 to mux"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (ffmpeg + Chromium deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: npm ci || npm install

      - name: Render Remotion video
        if: hashFiles('package.json') != ''
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ inputs.composition }}" out/video.mp4 \
            --codec h264 --crf 16 --scale "${{ inputs.scale }}"

      - name: Mux audio (if provided)
        if: inputs.audio_file != '' && hashFiles('out/video.mp4') != ''
        run: |
          ffmpeg -y -i out/video.mp4 -i "${{ inputs.audio_file }}" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest out/final.mp4

      - name: Upload rendered video
        if: hashFiles('out/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ inputs.composition }}
          path: out/*.mp4
          retention-days: 30
