name: Render Animated Short

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode slug inside src/episodes/ (e.g. amazon-bot-book)"
        required: true
        default: "amazon-bot-book"
      scale:
        description: "Output scale (1 = 1080x1920 HD, 1.3333333333333333 = 1440x2560 2K)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libgl1 libegl1 mesa-vulkan-drivers
          pip install --no-cache-dir numpy scipy edge-tts

      - name: Install Node dependencies
        run: npm install

      - name: Type-check Remotion engine
        run: npx tsc --noEmit

      - name: Generate cloud voiceover & word timings
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 scripts/voice.py --episode "src/episodes/${{ inputs.episode }}"

      - name: Build procedural audio mix (-15 LUFS)
        run: |
          mkdir -p out
          python3 scripts/audio_bed.py --episode "src/episodes/${{ inputs.episode }}" --props-out out/props.json

      - name: Render Remotion 3D + 2D video
        run: |
          npx remotion render src/index.ts "${{ inputs.episode }}" out/video.mp4 \
            --codec h264 --crf 16 --scale "${{ inputs.scale }}" \
            --props=out/props.json \
            --gl=swangle

      - name: Mux video + mastered audio
        run: |
          ffmpeg -y -i out/video.mp4 -i "src/episodes/${{ inputs.episode }}/audio/mix.wav" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest out/final.mp4

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.episode }}
          path: out/final.mp4
          retention-days: 30

      - name: Publish MP4 to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ep-${{ inputs.episode }}-${{ github.run_number }}"
          gh release create "$TAG" out/final.mp4 \
            --title "${{ inputs.episode }} (#${{ github.run_number }})" \
            --notes "Automated cloud render for episode ${{ inputs.episode }}."
