name: Ronaldo retained-take alignment only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ronaldo-development-narration
          run-id: 45112495474
          github-token: ${{ github.token }}
          path: out/retained
      - name: Align retained take without synthesis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import voice
          p=Path('out/retained')
          words=voice.align_groq_whisper(p/'narration.mp3',os.environ['GROQ_API_KEY'])
          (p/'words.json').write_text(json.dumps(words,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ronaldo-aligned-retained-narration
          path: out/retained/
          retention-days: 7
