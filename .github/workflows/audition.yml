name: ANC development narration (free only)
on:
  workflow_dispatch:
    inputs:
      episode:
        required: true
        default: anc-commute
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One full free-model take and existing free alignment
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/anc_narration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anc-development-narration
          path: out/anc-narration/
          retention-days: 7
