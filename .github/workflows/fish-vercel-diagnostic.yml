name: Fish Vercel free one-request diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One short free-model request through existing Vercel route
        env:
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          TWK_DIAGNOSTIC_RELAY_AUTH: ${{ secrets.TWK_DIAGNOSTIC_RELAY_AUTH }}
          TWK_DIAGNOSTIC_RELAY_BYPASS: ${{ secrets.TWK_DIAGNOSTIC_RELAY_BYPASS }}
        run: python scripts/diagnose_fish_vercel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-vercel-diagnostic-${{ github.run_id }}
          path: out/fish-vercel-diagnostic/
          retention-days: 7
